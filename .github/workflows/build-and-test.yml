name: Build and Test RaceDay Solution

on:
  push:
    branches: [ main, master, part-3 ]
  pull_request:
    branches: [ main, master, part-3 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build Part 2 API
        run: |
          dotnet restore "Part 2/RaceDay.Api/RaceDay.Api.csproj"
          dotnet build "Part 2/RaceDay.Api/RaceDay.Api.csproj" --no-restore --configuration Release

      - name: Restore & Build Part 3 MVC Web App
        run: |
          dotnet restore "Part 3/RaceDay.Web/RaceDay.Web.csproj"
          dotnet build "Part 3/RaceDay.Web/RaceDay.Web.csproj" --no-restore --configuration Release